name: Check

# The checks the deploy runs first, on experimental and on a pull request into main, so a
# failure shows before merging rather than at the deploy.
on:
  push:
    branches:
      - experimental
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Check
        run: bash tests/check.sh
