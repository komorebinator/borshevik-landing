name: Borshevik landing page
description: "The whole of borshevik.org: a handful of PHP scripts behind one entry point (@LandingPage#index) that serve three sections in English and Russian — the home page, the installation instructions and the news — through one shared layout (@LandingPage#layout); the choice of which installer images the site offers (@LandingPage#offered-isos), with the redirect that keeps the permanent ISO links pointing at that choice; and files that are no part of the pages but are served from this site, the App Manager's application list (@LandingPage#applications). What the pages say lives in Markdown files, one per page and language (@LandingPage#content) and one per news post and language (@LandingPage#posts), rendered by the site's own renderer for a small subset of Markdown (@LandingPage#markdown) — so writing a page or a post is writing text, never HTML, and the same text can later be turned into a Telegram post. The words of the interface around them — menu, buttons, footer — are per-language strings (@LandingPage#strings), so both languages share every line of markup and only the text differs. There is no framework, no build step and no database — the files in the repository are the files the web server runs, copied there by @BorshevikLandingWorkflow#deploy. One kind of file is not in the repository and is never touched by a deploy: the installer images in the server's `iso/` folder (@LandingPage#iso-directory), uploaded there by borshevik's publish-iso workflow, each under a name no other build shares. Everything else the site serves, the pages' and the posts' videos included, is in git (the author, 2026-10-24), so nothing a page shows depends on a file uploaded by hand. Uploading an image changes nothing a visitor sees; the site starts offering it when @LandingPage#offered-isos is changed and deployed. The page takes each offered ISO's size and checksum from the files on the server, so the numbers it shows are those of the file a visitor actually downloads."
extends: "@Software"
platform: PHP 8 behind LiteSpeed, which honours .htaccess rewrite rules (the production host is InterServer shared hosting). Uses only the standard library.
repository: https://github.com/komorebinator/borshevik-landing
src: .
tests:
  - id: checks
    description: "The failures that stay silent until a visitor or a new install hits them: a PHP file no longer parsing (the whole site answers 500), an applications.json the App Manager will refuse (first-login app installation breaks on every new machine), a string, page or post present in one language and missing from the other (that text quietly vanishes from one language), a post or page pointing at an image that is not there, a header link without its icon, an offered ISO name that is malformed or equal to a permanent link (the permanent link would redirect to itself), the permanent links or the routing to index.php no longer in .htaccess, the Markdown renderer changing what it makes of the syntax pages and posts rely on or letting raw HTML through, and the render path itself — every section in both languages, language choice, links, ISO size and checksum, and 404 for what does not exist. Run by @BorshevikLandingWorkflow#deploy before anything is uploaded, and before every commit."
    command: bash tests/check.sh
    expect: exits 0 and prints 'all checks pass'
  - id: seen-by-the-author
    description: Manual. Whether the page reads and looks right in both languages is nothing a script can judge, so the author serves the changed working tree and looks at it. This is the @BorshevikLandingWorkflow `implemented` step.
    command: "@LandingPage#recipes#run"
    expect: the author confirms that /, /install, /install/rebase and /news, and a news post, look right at http://127.0.0.1:8000 both as they open and with ?lang=ru, on a wide window and a narrow one
components:
  - id: check
    type: "@ShellScript"
    interpreter: bash
    src: tests/check.sh
    description: "The script behind @LandingPage#tests#checks. Needs php-cli, jq and curl, all present on the GitHub runner; on this machine it runs inside the same container @LandingPage#recipes#run uses, with jq installed alongside php-cli. Works from any current directory — it resolves the repository root from its own location — and never writes into the repository: everything it runs, it runs in a temporary copy, removed on exit. The checks that render pages run each request through index.php in a separate php process, with the request's path, query and Accept-Language set as a web server would set them."
    functions:
      - id: run
        description: "Runs every check, reporting each as ok or FAIL and going on after a failure; exits 1 if any failed, else prints 'all checks pass'. The checks: every post's ru.md and en.md render for Telegram by @LandingPage#announce#render, within its limits, so a post that would not go out to the channel fails before it is merged rather than after it is live; every PHP file parses; applications.json has the shape @LandingPage#applications says the App Manager needs; both string files carry the same keys, with no value empty; both languages have the same pages in content/; every post folder is named `YYYY-MM-DD-<slug>` and holds an en.md and a ru.md, each opening with a `# ` title and naming a picture that is not a video, for the news list (@LandingPage#posts); every relative image or video a page or post names exists beside it, a walk-through's `::video` line included; media/en/ and media/ru/ hold the same file names, and no video under media/ or posts/ is 5 MB or more — a page video loads only when scrolled to, and the Workspace Manager's, a minute long, is 4.5 MB at a quality that keeps window text sharp, where 3 MB blurred it (the author, 2026-10-23); every picture is named by the `# makes:` line of a script of tools/capture/pictures/ or of tools/capture/installer.sh, or listed in tools/capture/by-hand.txt; every header link in links.php is https and has its icon in icons/; the Markdown renderer turns a fixed sample of every construct @LandingPage#markdown supports into exactly the expected HTML, and escapes raw HTML and refuses a javascript: link; iso.php offers exactly a standard and an NVIDIA name, both of the unique form `borshevik[-nvidia]-<YYYYMMDD>[-<n>].iso` — which also keeps either from being a permanent link's own name, whose redirect would then point at itself; .htaccess holds the four permanent-link rewrites, the refusal of the source folders and the routing to index.php, in that order; each of /, /install, /install/rebase, /news and the newest post renders in the expected language for an explicit ?lang=, for a preferred Accept-Language and for an unsupported one, with no PHP warning in it, and /install, which carries the download buttons, links to both offered ISOs and show the size and checksum of an ISO that exists and no size for one that does not; served by PHP's built-in server with index.php as the router, an unknown path, an unknown post and a slug trying to leave posts/ answer 404 with the layout around them, and a file under lib/ or templates/ answers 403; the Russian home page, installation page and newest post each give a link preview whose address names the language, with a description and a picture that is an absolute address of the site and is there; and download.php redirects both variants and a checksum to the offered files and answers 404 for anything else."
  - id: capture
    type: "@ShellScript"
    interpreter: bash
    src: tools/capture/capture.sh
    description: "How the pages' screenshots and videos are made, all of it under tools/capture/, so every picture can be made again, the same way, when Borshevik changes — one command for all of them in a language (@LandingPage#capture#take). Not deployed and not part of the site. This script is the low-level half: one command per thing done to the virtual machine borshevik's test-image-in-vm.sh left running, so a picture is a sequence of small steps whose result can be looked at after each one. Runs on the host, where the machine's sockets are and where ffmpeg, ImageMagick and Chrome are. Finds the machine itself — the newest run directory of borshevik's test VMs whose QMP socket is live, and its SSH port from the qemu process serving it — so it takes no address. Keys and the pointer go through QMP, as if typed and moved at the machine, because that is what GNOME Shell reacts to like a person (a keyboard shortcut, a selection, a drag); everything else goes through SSH, as root, or as tester inside tester's own session; and what only GNOME Shell itself can do — slow its animations, place a window — through a small extension of tester's own that runs JavaScript in the shell over its own D-Bus name (installed by @LandingPage#capture#prepare). That extension is used rather than GNOME's own Shell.Eval because Shell.Eval answers only in GNOME's unsafe mode, which puts a warning icon in the panel of every picture."
    functions:
      - id: take
        description: Makes pictures by running scripts of @LandingPage#capture#pictures — the ones named, or all — in the session's language, or in the one given, logging tester in again in it first (@LandingPage#capture#prepare) when the session speaks another. `take all ru` and `take all en` make every picture the machine can stage.
      - id: prepare
        description: "Sets tester's session up for pictures in a language: tester an administrator, as whoever installed the system is — without it the Image Manager cannot even check for updates; automatic updates off and any update already staged removed, since a downloaded update puts Update Indicator's icon in the panel and Restart & Update in the power menu of every picture; Flatpak's translations fetched for both languages, since Flatpak otherwise keeps only those of the languages in use when an app was installed and the Russian pass would show English apps; the applications of every default group of share/applications.json installed, as the App Manager does on a first login — the test machine marks tester's first run done, so a new machine has none of them, not even the editor or Calculator — before the fresh login, since the session's D-Bus only learns of an app installed while it runs at the next one, and until then its dock icon starts nothing; the home folders renamed for the language, the other language's emptied ones removed and the Files sidebar's bookmarks pointed at them, so no dialog asks about it over the first pictures; the capture helper extension installed (see this component's description); Calculator in the dock, so a scene can open it with a click; Chrome's launcher copied into tester's own applications with the flags lib.sh starts Chrome with, so Chrome opened from the dock asks neither the first-run questions nor for a keyring password; mutter told to draw the pointer in software, where a screen dump sees it; the dark style, the US and Russian keyboard layouts, no notification banners; the interface language through AccountsService, then a fresh login, since a running session does not change language — tester's session ended first and GDM restarted only once it is gone: restarted while the session is still closing, GDM finds the old login's worker alive after five seconds, gives up on the display and logs nobody in, which happened on the second prepare after a boot (2026-10-21); animations turned back on, which GNOME Shell turns off where rendering is not hardware-accelerated; and the display at 1440×900 (@LandingPage#capture#mode)."
      - id: mode
        description: "Sets the display to 1440×900 through mutter's DisplayConfig and confirms GNOME's keep-these-settings question: 16:10 like a laptop, and small enough that the interface is still legible when a screenshot is shown at half size on the site."
      - id: shot
        description: Takes the screen as it is through QMP into a PNG on the host, and prints its path, so it can be looked at before it is kept.
      - id: still
        description: "Turns a PNG into one of the site's screenshots: WebP, at most 1600 pixels wide."
      - id: key
        description: Presses a key combination on the machine, written as qemu key names joined by '-' (`meta_l-t`, `ctrl-alt-shift-r`).
      - id: type
        description: "Types text by pressing its keys one after another — the keys, not the characters: with the Russian layout active, typing `terminal` writes 'еуктштфд', which is how the app-search demonstration is made. It finds Terminal and starts it, then closes it: an app it starts must work in the test machine, which Steam, with no account there, does not (the author, 2026-10-24)."
      - id: pointer
        description: Moves the pointer to a point of the screen — 1440×900, or the size CAPTURE_W and CAPTURE_H give for a machine whose screen is another, such as @LandingPage#capture#installer's —, clicks there, or drags from one point to another, through the machine's USB tablet.
      - id: session
        description: Runs a command as tester inside tester's graphical session — the session's D-Bus, Wayland display, language and desktop name, the last two taken from GNOME Shell's own environment, since an SSH connection carries neither; Settings refuses to start without XDG_CURRENT_DESKTOP; and the X display and its authority, taken from tester's user manager, since GNOME Shell starts Xwayland on demand and keeps neither in its own environment, and Steam, an X11 app, otherwise only shows that it cannot open a display — to change a setting or read the session's state.
      - id: launch
        description: Starts an application the way GNOME Shell does, in a scope of tester's user manager. Started straight from the SSH connection it would belong to that remote session, and polkit refuses an app there what it grants one on the seat — the Image Manager's update check among them.
      - id: reset
        description: Closes every application window tester has open, Telegram's included, which a click that misses the dock icon meant can open, so a scene starts from an empty desktop.
      - id: place
        description: Puts a window, found by its class, at a position and size through Shell.Eval, and clears the Workspace Manager's mark that it was just moved by the user — a window placed this way is where a scene starts, not one the user put there, and the mark would keep the extension from moving it away once it is covered.
      - id: center
        description: Puts a window, found by its class, in the middle of the work area at the size it has, unmaximized if it was — a window shown on its own is shown centred, and an app that remembers its last position does not open where it last stood.
      - id: opens-at
        description: "Has the next window of a class to open put at a point as soon as it shows, at the size it opened at, for a scene filmed from an empty desktop whose windows must open apart: GNOME centres every new window, and the Workspace Manager's video needs a piece of Files' and Terminal's title bars left uncovered when Hiddify lands over them. Only the position is set, after the window's first frame, so the Workspace Manager still judges the window by the size it opened at."
      - id: close
        description: Closes a window, found by its class, as its close button does, so the app saves what it keeps on closing — the editor its window's size, which is how shaped makes it open tile-shaped.
      - id: windows
        description: "Prints where every window is — its class, workspace, frame and whether it is maximized, minimized or focused — and which workspace is shown: what a scene's coordinates are worked out from, step by step, before it is filmed, and how a step that went wrong is told from one that went right."
      - id: eval
        description: "Runs JavaScript in GNOME Shell through the capture helper and prints what it returns: for state no command reads, such as whether the Workspace Manager's Window Rules are open, and for film's lookups."
      - id: film
        description: "Films a scene — in a machine with no SSH and no GNOME Shell, such as @LandingPage#capture#installer's, as it plays, in real time at 30 frames a second, there being nothing there to slow down; otherwise as below — a file of timed steps: keys, typing, pointer moves, glides, clicks, double and triple clicks, the pace typing takes from there on (0.12 s a key unless a scene sets another), waits for a pixel to turn a colour — or any colour but one, as a greyed-out button stops being greyed out, or one near it, within 12 a channel, where only a compressed picture gave the colour (2026-10-29) — which hold the steps after them, the filming going on, for as long as that takes — a wait's time cut out of the video by @LandingPage#capture#cut, for which film writes where in the take each began and ended, a hold's kept — waits for the screen to stop changing for some seconds, cut out the same way, for what settles bit by bit, such as the App Manager's icons loading; stretches played faster by cut, for what the machine cannot be driven through faster, as the installer loses keys typed quicker than 0.1 s apart (2026-10-29); the machine's network cable pulled out and plugged back in, through QMP; and drags, which may go on through several points before the button is let go, to carry a window about — from the host, frame by frame through QMP, while the machine plays it a few times slower than real: GNOME Shell's animations are slowed by that factor through the capture helper, the steps are sent on the slowed timeline, and the frames, taken at a steady rate, are encoded as if taken that many times faster, so the video runs at normal speed with every animation whole. A click's press and release, and the presses of a double click, are timed in real time, not slowed with the scene: held for the slowed time, a click went unheard in parts of GTK — Files' sidebar — and a double click's second press came before its first was released, so it only selected (2026-10-22). GNOME's own screen recorder is not used for this: in a machine with no graphics acceleration it keeps one or two frames a second, and an animation of a quarter second leaves no trace in it — the first videos taken that way showed windows jumping instead of moving. The pointer is in the picture because prepare has mutter draw it in software. A step can also find a button in GNOME Shell's own interface as the scene plays — the first one after the label with a given text — for the steps after it to point at, where a scene cannot know beforehand where the button will be: the Workspace Manager's Windows tab lists the windows in no fixed order. It is looked up in a thread, so filming goes on meanwhile. A screen of another size than the take's, as a restarting machine's firmware shows for a moment, goes in as a black frame, so the frames after it are not shifted (2026-10-27). While a scene is filmed the panel's clock is stopped, a still copy shown in its place: slowed down a scene lasts minutes, and a minute turning over would make the video's last frame differ from its first."
      - id: clip
        description: "Cuts a filmed scene to one of the site's videos: from a start to an end time, at most 1600 pixels wide, 60 frames a second, H.264 without sound, prepared for playback as it downloads. One take is one video: a demonstration that came out wrong is filmed again, never edited — the walk-throughs alone have what only takes time cut out, and the installer's a stretch sped up, by what their scenes say (@LandingPage#capture#cut). It then says how many pixels of the video's last frame differ from its first by more than 8% — a few hundred scattered over text are the encoder's noise, a moved window or pointer is thousands — since every video loops on the site and must end exactly as it starts (@LandingPage#capture#scenes)."
      - id: cut
        description: "Cuts the take of a walk-through whose scene waits for something that takes as long as it takes — an installation, a USB stick being written — to one of the site's videos: every wait of the scene cut out of the take, and every stretch it speeds up played that many times faster, where @LandingPage#capture#film wrote them next to it — reckoned from the scene's end, as at first, only the last could be cut, and wrongly once a hold came after it (2026-10-27) — then clipped as @LandingPage#capture#clip does, cropped when asked. Such a video does not loop; the site plays it with controls (@LandingPage#markdown#markdown_player)."
      - id: stick
        description: "A 16 GB USB stick in the test machine, plugged in and empty: a file next to the machine's disk, plugged in through QMP the first time as a SCSI disk on a USB bulk-only device that tells the machine it is a SanDisk Ultra, so the apps name it as they would a real one rather than as QEMU's disk — a usb-bot plugged into a running machine stays detached until told otherwise. Wiped every time: its partitions unmounted, as GNOME mounts what was written on it, its signatures and first megabytes cleared, and the kernel's record of its partitions dropped, which outlives the wipe — Fedora Media Writer offers to restore a stick it has written instead of just writing it."
      - id: put
        description: "Copies a file of the host's into the test machine, as root over the same SSH connection: for what a scene needs that the machine cannot fetch quickly, such as the ISO Media Writer writes."
    components:
      - id: pictures
        type: "@ShellScript"
        src:
          - tools/capture/pictures/
          - tools/capture/lib.sh
          - tools/capture/posts/
        description: "One script per picture, or per pictures taken from one scene, each opening with a `# makes:` line that names what it produces in media/<lang>/; @LandingPage#tests#checks refuses a picture that no script makes and by-hand does not list, so a picture added to a page comes with the way to make it again. A script starts from an empty desktop, stages its scene with @LandingPage#capture's commands, and keeps the screen with lib.sh's keep or films a scene with its film. lib.sh holds what they share: the session's language, which decides the folder pictures go to; opening Chrome, the editor or a PDF; the two PDFs put in tester's documents, so no script depends on another having run first; Files and Chrome side by side; dock, apps added to the dock for a scene that opens them from it; shaped, the apps the Workspace Manager's scenes open set to open at the sizes those scenes need — the editor, Files and Settings tile-shaped, so each is tiled as it opens, Chrome maximized; and fresh, the empty desktop, with the apps the scenes use set to start the same way every time — the editor's note.txt, Calculator small, Papers without its sidebar, Chrome not offering to translate the page and opening on the right half, the dock as Borshevik ships it plus Calculator, the Workspace Manager with only its own window rules and no float size learnt, and its Window Rules closed, which Esc does not do. Where a step depends on the language, as where a tab's label lies, the script says so. lib.sh also holds what pictures of Android need: gpu_shown — the test machine has no GPU Android can render on (borshevik-waydroid counts every virtio GPU, virgl's included, as none, and the GNOME Boxes qemu cannot screen-dump a GL display anyway), so until the next boot a wrapper bind-mounted over borshevik-waydroid answers `rendering` with `hardware` to tester alone, and the Image Manager shows no warning a machine with a GPU never shows, while root, and the install, still render Android in software, the one way it boots there (the author, 2026-10-24); android_installed, as the Image Manager installs it for tester, which starts the colour sync in tester's session; android_removed after, with tester's launchers of its apps, which every other app grid would show; and android_tab. steam.sh shows games as anyone first sees them, with no account the test machine could hold: Steam's sign-in window beside Battle.net's, Battle.net installed by PortProton, from the App Manager's games, to show that other launchers run too (the author, 2026-10-24). PortProton is installed for it and removed after with its data, deleted as tester's since flatpak's --delete-data run as root leaves them, so the app grid of the other pictures does not show it and the next run installs Battle.net again in its language, which Battle.net keeps from its installation. Nothing in it clicks a button that moves with the language: PortProton's first start opens its main window, or just ends, and Battle.net's tile is found from the window's edge or the autoinstall asked again; the installer's buttons stand where they stand in both languages; Battle.net is started by PortProton's command line, past its launch dialog; and Steam, started last since its sign-in QR code greys out within minutes, is set to the session's language in its own registry. Battle.net's window, moved, draws white until it is minimized and shown again. It keeps its own 362 pixels, at which the Russian heading, «Войти или зарегистрироваться», is cut with a scroll bar under it: that is how Battle.net shows it to everyone, and the author kept it (2026-10-27). tools/capture/posts/ holds the scripts and scenes of posts' pictures, one script per post, named after it and run once for the post in each language; it uses lib.sh, keeps into the post's folder, and is described by its own comments, not here."
      - id: scenes
        type: "@ConfigFile"
        src: tools/capture/scenes/
        description: "The scenes the pages' videos are filmed from — a post's are with its script in tools/capture/posts/ — one file each, for @LandingPage#capture#film — the timed steps only; where the windows stand when a scene starts is its picture script's — and the HTML the translation scene's PDF is printed from, in both languages: the Russian page translates the English PDF and the English page the Russian one. Every scene ends exactly as it starts — the same windows in the same places, the same workspace shown, the pointer at the same point — because the site plays such a video in a loop, and a loop that jumps at its seam looks broken (the author, 2026-10-22); @LandingPage#capture#clip measures it. The walk-throughs of the installation page are not loops: they run from a first screen to a last, are cut where they wait (@LandingPage#capture#cut) and are played with controls — the installer's (installer-<lang>.txt, @LandingPage#capture#installer) and Fedora Media Writer's (media-writer.txt, from its first screen through Select .iso file, the ISO picked in Downloads, the stick, Write, the erase confirmed and the administrator's password, to a few seconds of writing and Finished; one scene for both languages, the app's buttons standing in the same places in each, and the video cropped to the app and its dialogs, which take a small part of the screen; 2026-10-25) and the NVIDIA key's (mok.txt, one scene for both languages, keys only: from the boot screen's message, its countdown running, R; the restart cut out; then on the blue screen, which opens on its menu, Enroll MOK, Continue, Yes, the password borshevik and Reboot, and the restart, not whole: a hold until the firmware's logo shows, then a wait, cut out, past GRUB's menu to Borshevik's boot screen — its logo and the disk's passphrase prompt — where the video ends a second later (the author, 2026-10-27). Every step of a scene that a person would do with the pointer is done with it — dragging to the halves, the window buttons, the dock, the workspace buttons — since a video in which things change while the pointer stands still does not show how they were done. Coordinates are those of the 1440×900 screen; the dock's move as apps start, since a running app the dock does not hold gets an icon at its end and the dock, centred, shifts the others by half an icon. The Workspace Manager's video shows, in one take from an empty desktop and back, with the overview opened by Super, as people open it — not by the button in the panel's corner — and an app the dock holds clicked there, one it does not found by its name (the author), everything else done with the pointer, window buttons included, the drags that tile quick, as a hand makes them, and no pause after them, how it places windows by itself: Files and Terminal opening floating; Chrome opening maximized onto a workspace of its own and Hiddify floating over it; Hiddify, once beneath Chrome, moved onto the floating workspace on the left, and once Files and Terminal are tiled over it, onto a new one further left, the view going back to the tiles when it closes; the PDF opening maximized onto a workspace of its own, dragged out by its title bar so it floats home with the pointer, and dropped on Terminal's half, displacing Terminal onto a workspace of its own, which the panel's buttons visit and leave — a displaced window shown going somewhere, not vanishing — and which comes back when the PDF closes; and Chrome dragged into the half Terminal left, maximized by its button onto a workspace of its own and restored by it back into its half. A double click on a title bar is not used, since it cannot be seen. A tile-shaped window tiled as it opens is not in it: Files and Terminal must open floating for Hiddify to land among them, and an editor opened at the end to show it read as an unexplained extra step (the author). The maximized and restored tile is one meant for looking at, Chrome, rather than a tool (the author). It is not the PDF while Terminal waits for the PDF's half: maximized, the PDF would free the half, Terminal would come back to it, and the PDF, restored, would find it taken and stay on its own workspace. Nor the PDF opened again tile-shaped: Papers shows its window at 600×600 and only then grows it to its remembered size, and the Workspace Manager judges a window once, at its first frame, so it floats. The panel's video starts from three workspaces — Weather, Calendar and Contacts floating on the first, Files and Terminal tiled on the second, Chrome maximized on the third — clicks every workspace button, drags the first past Chrome's at a hand's speed so it becomes the third, clicks the empty workspace at the end, where the overview opens by itself, and starts Secrets from the dock there, so the panel shows a new empty workspace after it; then closes Secrets by its close button, its workspace going away and the view going to the one on its left, the moved one, which it drags to the front again; then drags the empty workspace at the end between the first two, where a new one is made and shown and the overview opens by itself, as on the last (the Workspace Manager's issue #12), and starts Calculator there from the dock — a new workspace left empty would say nothing of what it is for (the author, 2026-10-30) — and closes it, the new workspace going away with it and the view going to the first. The workspace stays moved while the new one is made, long enough to be seen: dragged straight back, the view never left it and only the panel changed for a second, which read as nothing having happened (the author, 2026-10-24). Closing Secrets and dragging the + show what the home page says of workspaces coming and going (the author, 2026-10-30), and leave the panel as it started, so this video too ends exactly as it starts. The window rules' video starts from the editor and Calculator floating apart; the editor is carried over Calculator and covers it, a rule for Calculator is made from the Windows tab — always on top — and, saved, brings it in front at once; the editor carried over it again stays beneath it, and is put back where it was (the author, 2026-10-24). Floating windows, since a guest of a tile workspace that ends up beneath its tiles would be moved away; carried by a point of the title bar away from the title, where the editor's tooltip shows the file's path, user name and all. The app search's video, over Files and Chrome side by side, opens the overview by Super, switches to the Russian layout and types `terminal`, which reads 'еуктштфд', finds Terminal and starts it with Enter, switches the layout back and closes Terminal by its button — Terminal, since Steam, the example the page's text gives, has no account in the test machine to start with (the author, 2026-10-24). The translation's video, one scene per language, selects a paragraph of the PDF in the other language with the pointer, translates it with Super+T, and closes the translation with Esc and the selection with a click where the pointer started."
      - id: installer
        type: "@ShellScript"
        src: tools/capture/installer.sh
        description: "The installer's video, media/<lang>/installer.mp4: the whole installation, from the installer's first screen to the desktop, in one video (the author, 2026-10-29). The installer asks for the disk and the encryption passphrase alone: Installation Destination, encryption and its passphrase, Begin Installation, the installation's first seconds — enough to show it has started — and its end, Reboot System pressed; then the first start: the passphrase at the boot screen's prompt, GNOME Initial Setup — its welcome, Privacy, the time zone, the user, the password, Start Using Borshevik — the tour that follows skipped, and the desktop with the App Manager, its list and icons loaded, where the video ends as soon as the pointer comes to rest: an App Manager still downloading its list is not shown (the author, 2026-10-29). Its window, grown downwards as its list loads, rests on the screen's bottom edge, as it opens on a 1440×900 screen, and is left so (the author, 2026-10-29). What only takes time is cut out (@LandingPage#capture#cut): the installation's middle, a minute or more of a progress bar, the restart, the boot after the passphrase, the session starting and the App Manager loading behind the tour. Forty seconds exactly, in both languages (the author, 2026-10-29): the scene ends a moment after the pointer comes to rest, and `take` keeps the first forty seconds of what cut makes, as a take's length varies with how long Initial Setup's checks keep its Next greyed out; each step follows as soon as the screen it needs is up and answering, and while the hub comes up, up to three and a half seconds after the first screen, and while the disk screen gets ready to take a click, over a second after it opens (a click 1.2 s after it went unheard, 2026-10-25), the pointer travels on rather than standing still (the author, 2026-10-29); the first fourteen seconds play one and a half times faster, as the author asked of the slow start, since the passphrase cannot be typed faster than 0.1 s a key: the installer weighs its strength at every key and, filmed, falls behind, and at 0.07 s its last keys landed in the confirmation after the click there (2026-10-25). Initial Setup's Next is clicked only once it is no longer greyed out, and the password's confirmation only once the password's strength bar is full: the machine, busy being filmed, falls behind keys, and a click sooner went unheard or overtook the last of them (2026-10-29). The passphrase is cloudberry-42 and the password swamp-larch-42, short as the author asked and which pwquality rates 100 — not one with the user name in it, which Initial Setup marks weak (2026-10-29). The user is Lily, user name lily: a plant's name, no surname, as nobody types theirs there (the author, 2026-10-25). The machine is off the network until the time zone is chosen — Initial Setup, on it, locates the filming machine and shows where it is on the map — so the city is searched for — Moscow in Russian, New York in English, American English being the installer's, not Moscow in both (the author, 2026-10-29) — typed in the us layout Initial Setup has; the network then comes back for the App Manager's list. A video rather than screenshots, since the installer is one path of clicks between its hub and its screens, which separate pictures did not show (the author, 2026-10-25); it does not loop, so the site plays it with controls to scrub and pause. Made from the ISO as borshevik.org serves it, booted in a machine of its own with an empty disk. `installer.sh take <iso> <lang>` boots it, films scenes/installer-<lang>.txt and powers the machine off; the two scenes are the same steps, the coordinates differing by language. The installer has no SSH, so the machine is driven through @LandingPage#capture's screen, keyboard and pointer commands alone, which CAPTURE_VM points at it, and filmed in real time (@LandingPage#capture#film). Its display is a standard VGA at 1440×900: with virtio-vga the pointer is drawn on a plane of its own that screendump leaves out, and asked for 1440×900 that ISO hung switching to its root (2026-10-25). GRUB's Install entry is edited to boot with the language and without the installer's guess by the network's location, which picks the language and time zone of wherever the filming machine is. `installer.sh boot <iso> <lang> secure` starts the machine with Secure Boot instead — Fedora's own firmware and variables with Microsoft's keys enrolled, taken from its edk2-ovmf package into the cache once, as the Boxes flatpak ships none. It also makes the NVIDIA key's video, media/<lang>/mok.mp4: `installer.sh mok <nvidia-iso> <lang>` boots the NVIDIA ISO with Secure Boot, installs it by playing scenes/installer-<lang>.txt up to its first start (its take thrown away), unlocks the disk at the first start once the passphrase's prompt shows, films scenes/mok.txt from the moment the boot screen shows the message borshevik's setup-ublue-mok.sh puts there, cuts out the restart between the message and the blue screen, and powers the machine off — one installation per language, the message being in the system's. The message is the one of borshevik's issue #76 (2026-10-26); an ISO from before it asks for a PIN instead and never shows it, so the video needs an ISO built since. It also takes the picture of the USB drive's boot menu, media/<lang>/grub.webp: `installer.sh grub <iso>` boots the standard ISO, takes the screen while GRUB's menu is up with its default, Test this media & install, highlighted — the entry the installation page tells people to leave — cropped to the menu, its title and its help, and powers the machine off; GRUB speaks English whatever the language, so one picture serves both (the author, 2026-10-31). Its `# makes:` line counts for @LandingPage#tests#checks as a picture script's does."
      - id: by-hand
        type: "@ConfigFile"
        src: tools/capture/by-hand.txt
        description: The pictures no machine of ours stages, each with why; none at present, the MOK screen, the last, being filmed by @LandingPage#capture#installer since 2026-10-27. The author takes them on a real machine, in both languages, with nothing personal in the panel.
  - id: index
    type: "@Script"
    interpreter: php
    src: index.php
    description: "The one entry point for every page: @LandingPage#htaccess routes every request that names no existing file here, and under PHP's built-in server (@LandingPage#recipes#run) the same script is the router. Stateless: nothing is cached between requests, so a switch to other ISOs, a new post or an edited page shows up on the next page load after the deploy."
    functions:
      - id: route
        description: "Maps a request path to the page it names: `/` the home page, `/install` the fresh-installation page, `/install/rebase` the page on switching from another Fedora Atomic or uBlue system, `/news` the news list, `/news/<slug>` one post — each with or without a trailing slash — and anything else to not-found. Only the path is looked at; the query is not part of the route."
      - id: run
        description: "Under PHP's built-in server, a request for a file that exists in the working tree is handed back to the server to send as it is (returning false), as the web server does in production; source folders refused there (@LandingPage#htaccess) are refused here too. Otherwise routes the request path, picks the language with @LandingPage#site#pick_locale, reads which ISOs are offered and their size and checksum, and renders the page into @LandingPage#layout: the home page (@LandingPage#layout#home), a page of @LandingPage#content, the news list or a post (@LandingPage#news). A path that names nothing, or a post that does not exist in that language, answers 404 with the layout's not-found page rather than a bare error, so a visitor following a stale link still has the menu. Every answer carries Vary: Accept-Language and Content-Language, so caches keep the languages apart."
  - id: site
    type: "@Script"
    interpreter: php
    src: lib/site.php
    description: "What every page needs besides its own text: the language, the offered ISOs' metadata, links that keep the language, and rendering a template. Defines functions only and does nothing when included."
    functions:
      - id: pick_locale
        description: "The page's language: the `lang` query parameter when it names a supported language, else the supported language the Accept-Language header weights highest (a regional tag counts as its base language), else English."
      - id: explicit_locale
        description: The language the `lang` query parameter names when it names a supported one, else null — whether the visitor chose the language rather than their browser choosing it for them.
      - id: url
        description: A link to a path of the site, carrying `?lang=<code>` only when the current page's language was chosen explicitly (@LandingPage#site#explicit_locale). A visitor who switched language keeps it from page to page, while one who did not gets clean links that every visitor's own browser language resolves.
      - id: site_origin
        description: "The scheme and host the site is reached at, for the absolute addresses a link preview needs: those of the current request — https when the server says so, directly or through a proxy's X-Forwarded-Proto — and borshevik.org when the Host header is not a plain host name with an optional port."
      - id: e
        description: "Escapes text for HTML, quotes included. Every value a template prints goes through it, the templates and strings holding no escaping of their own — except HTML the site produced itself: rendered Markdown, the inlined icons and the downloads block."
      - id: read_checksum
        description: The hash from an ISO's -CHECKSUM file in `iso/` (the first word of its `<hash>  <name>` line); empty when the file is missing or empty.
      - id: read_iso_size_gb
        description: An ISO's size in `iso/` as binary gigabytes with one decimal, e.g. '2.7 GB'; empty when the file is missing or unreadable.
      - id: load_strings
        description: The interface strings (@LandingPage#strings) of a language, falling back to English for a language with no file.
      - id: render
        description: Runs a template of @LandingPage#layout with the given variables and returns what it printed.
  - id: markdown
    type: "@Script"
    interpreter: php
    src: lib/markdown.php
    description: "The site's own renderer for the subset of Markdown that pages and posts are written in — no library, so the subset is exactly what this script and @LandingPage#check say it is, and nothing a post uses can turn out unsupported once it reaches Telegram, whose formatting covers the same constructs. Raw HTML is not part of it: everything written in a page or post is escaped, so text can never break the layout or inject a script, and a link is made only for http, https, mailto, a path or a fragment. Defines functions only."
    functions:
      - id: markdown_to_html
        description: Renders a document block by block; blocks are separated by blank lines. A line of `#`, `##` or `###` and a space is a heading; lines starting `- ` make a bulleted list and lines starting `1. ` (any number) a numbered one, a line indented under an item continuing it; lines starting `> ` a quote; a fence of three backticks a code block, kept verbatim until the closing fence; a line of `---` a rule; a line `::<name>` a directive, replaced by what the caller's callback returns for that name (`::downloads` and `::media-writer` place their buttons on the installation page; `::exclusive`, read by @LandingPage#markdown#markdown_sections, renders as nothing in the text itself) or by nothing for an unknown one; a line `::video <src> <caption>` a video to watch rather than one that loops (@LandingPage#markdown#markdown_player); a block that is a single image alone a figure, its alt text as the caption; anything else a paragraph, its single line breaks joined into spaces. Images and videos are found relative to the base path the caller gives — the post's folder, or media/ for a page.
      - id: markdown_inline
        description: "Renders the text inside a block: `` `code` `` (nothing inside it is interpreted), `**bold**`, `*italic*`, `[text](url)` — opening in a new tab when it leads off the site — and `![alt](src)`, an image, or a video when src ends in .mp4 or .webm. A video plays the way an animated picture does — by itself, muted, looping, inline on phones, with no controls — because such a video is a short silent demonstration of one action, not something to watch from the start — the one kind that is, a walk-through, is written with `::video` instead; it loads only its first frame until it plays. It is not marked autoplay, which would have the browser download every video of the page as it opens — some 6 MB on the home page, most of it never scrolled to (found in review, 2026-10-27): the page's script (@LandingPage#layout#frame) starts it once a quarter of it is in view and pauses it when it leaves. A src that is a bare file name is resolved against the base path; one starting with `/` is used as it is."
      - id: markdown_player
        description: "A video to watch from its start rather than one that loops by itself: a figure with the browser's own controls to play, pause and scrub, not looping, its caption below it and as its label, loading only its first frame until played. Muted, as browsers start a video by themselves only when it is, and marked for @LandingPage#layout's script to start it once it is scrolled to. For a walk-through such as the installer's (@LandingPage#capture#installer), whose viewer goes back to the step they are on. A src that is not a safe address or not a .mp4 or .webm leaves only the caption, as text."
      - id: markdown_sections
        description: "Splits a page into the parts @LandingPage#layout#home lays out side by side: a `# ` line starts a group, given as its title alone; a `## ` line starts a section, which runs to the next `#` or `##` line and is given as its heading, its first block that is a single image or video (the one shown beside the text, empty if there is none), the rest of its Markdown, and whether it holds the `::exclusive` directive. The parts are Markdown still; rendering them is the caller's."
      - id: markdown_excerpt
        description: The first paragraph of a document as plain text with its inline markup removed, for the news list.
      - id: markdown_first_image
        description: The src of the first image a document shows, resolved against the base path like any image, skipping videos and unsafe addresses; empty when there is none.
  - id: news
    type: "@Script"
    interpreter: php
    src: lib/news.php
    description: "Reads the posts of @LandingPage#posts. Nothing is indexed: every request lists the folder again, which for a few dozen posts costs nothing and leaves nothing to fall out of date. Defines functions only."
    functions:
      - id: news_list
        description: Every post that has a file in the given language, newest first by the date in its folder name (posts of one day by folder name), each with its slug, date, title, excerpt and the address of its first picture — the first image it shows, skipping videos, which have no still to show — or an empty one when it has none. A folder whose name is not of the post form is skipped.
      - id: news_post
        description: One post in the given language — its slug, date, title and the Markdown body without its title line — or null when the slug is not of the post form, no such folder exists or it has no file in that language. The slug is matched against the post form before it touches the filesystem, so a request path can never reach outside posts/.
      - id: split_title
        description: A Markdown document split into its title, the text of its first line when that line is a `# ` heading, and the rest.
  - id: announce
    type: "@Folder"
    src: tools/telegram/
    description: "What @BorshevikLandingWorkflow#announce sends: a post turned into Telegram's two messages, and the sending. Run on GitHub's runner, which has PHP, curl and jq, and ffmpeg once announce.yml installs it where missing; nothing here is served."
    components:
      - id: render
        type: "@Script"
        src: tools/telegram/render.php
        description: "Given a post's folder and a language, prints as JSON the text and the media of @BorshevikLandingWorkflow#announce's messages. The text is the post's Markdown (@LandingPage#markdown) in Telegram's HTML: the title and the ## headings as bold lines, paragraphs as they are, - items as • lines and numbered ones numbered, a quote as <blockquote>, a code block as <pre>; inline, what @LandingPage#markdown#markdown_inline makes, its <strong>, <em>, <code> and <a href> being tags Telegram knows, with the attributes Telegram does not know dropped and a link to the site's own pages made absolute on https://borshevik.org; blocks a blank line apart. No link back to the post: the channel's post is the site's, whole (the author, 2026-10-31). The media are the standalone picture and video lines and ::video lines, in order, each a photo or a video and its file in the folder, left out of the text. It fails, rather than print, a text longer than Telegram's 4096 characters or more than ten media, an album's limit."
      - id: send
        type: "@ShellScript"
        src: tools/telegram/send.sh
        description: "Sends one post to one chat with the Bot API: @LandingPage#announce#render's text with parse_mode HTML and the link preview off, then its media, the files as they are, as an album replying to that text; fails on the first answer that is not ok, printing Telegram's description."
  - id: offered-isos
    type: "@ConfigFile"
    src: iso.php
    format: PHP returning an array
    description: "Which installer images the site offers — the one place that says so, read by @LandingPage#index and @LandingPage#download. Returns `['standard' => '<file name>', 'nvidia' => '<file name>']`, names of files in @LandingPage#iso-directory. Switching the site to newly uploaded ISOs is a change to these two names, committed and deployed like any change; @BorshevikLandingWorkflow#deploy refuses to deploy names whose ISO or -CHECKSUM is not on the server, so a switch cannot break the download buttons. Contains no logic and prints nothing, so requesting /iso.php directly shows an empty page."
  - id: download
    type: "@Script"
    interpreter: php
    src: download.php
    description: "Where the permanent ISO links end up (@LandingPage#htaccess rewrites them here): redirects to the file currently offered."
    functions:
      - id: run
        description: "Loads the offered names from iso.php. Reads `variant` from the query; when it is not a string naming a key of that array, answers 404 with text/plain 'Not found' and exits. Otherwise takes that variant's file name, appends '-CHECKSUM' when the `file` query parameter is exactly 'checksum', and answers 302 with `Location: /iso/<rawurlencoded name>` and `Cache-Control: no-store`, so neither browsers nor proxies keep sending people to an ISO the site no longer offers."
  - id: htaccess
    type: "@ConfigFile"
    src: .htaccess
    format: Apache/LiteSpeed rewrite rules
    description: "Three jobs, in this order, since the first rule that matches ends the request. First, keeps the ISO links that have been published for years — https://borshevik.org/iso/borshevik-stable.iso, the NVIDIA one, and their -CHECKSUM files, all used by the borshevik README and anywhere else people copied them — pointing at whatever the site offers now, instead of at a file that may be long gone. `RewriteEngine On` and four internal rewrites, each ending in [L]: `^iso/borshevik-stable\\.iso$` → `download.php?variant=standard`, `^iso/borshevik-stable\\.iso-CHECKSUM$` → `download.php?variant=standard&file=checksum`, `^iso/borshevik-nvidia-stable\\.iso$` → `download.php?variant=nvidia`, `^iso/borshevik-nvidia-stable\\.iso-CHECKSUM$` → `download.php?variant=nvidia&file=checksum`. The rules match the URL whether or not a file of that name exists, so old files still lying under those names on the server are never served again. Second, answers 403 for lib/, templates/, i18n/ and content/: they are deployed because index.php reads them, not to be fetched, and a template requested directly would run without its variables and print PHP's warnings. Third, hands every request that names no existing file or folder to index.php, which is what makes /install, /news and /news/<slug> exist; real files — the stylesheet, images, the posts' pictures and videos, iso/, share/ — are served as they are, never through PHP."
  - id: layout
    type: "@View"
    description: "Every page of the site: one set of PHP templates in templates/, shared by both languages, which differ only in the strings (@LandingPage#strings) and the Markdown (@LandingPage#content, @LandingPage#posts) poured into them. Templates are plain PHP that print variables through @LandingPage#site#e and loop over lists; they hold no text of their own and no logic beyond that. Adding a language means adding its strings file, its content/ folder and a translation of every post, and registering it in the list of supported languages in @LandingPage#index#run."
    components:
      - id: frame
        type: "@Template"
        src: templates/layout.php
        engine: PHP
        output_format: HTML
        description: "The complete HTML document around each page, with the site's one script on a page that has a video and on no other: it starts a looping video (@LandingPage#markdown#markdown_inline) once a quarter of it is scrolled into view and pauses it when it leaves; and it starts a walk-through video (@LandingPage#markdown#markdown_player) once half of it is scrolled into view and pauses it when it leaves, until its viewer pauses it or it ends, after which starting it is theirs; without JavaScript the video waits to be played (the author, 2026-10-25). On a page with a code block, and only there, a second script puts a copy button in each block's top right corner — an icon, labelled Copy in the page's language, that copies the block's text and shows a check mark for two seconds; the block keeps room for it on the right so a long command never runs under it; without JavaScript there is no button and the text is selected by hand (the author, 2026-10-31). Around each page: `lang` set to the page's language, the page's title followed by 'Borshevik Linux', the page's description, and the link preview Telegram, X and the like show for it (Open Graph and a large Twitter card): that title, that description, a picture, the page's address and its language. The address always names the language (`?lang=`), since a preview's fetcher sends no language of its own and would otherwise get the English page — so a link posted to the Russian channel should carry `?lang=ru` too. Addresses in the preview are absolute, from @LandingPage#site#site_origin. Then borshevik_logo.svg as the favicon and style.css as the stylesheet. Then the header and the page's own body in a main element. There is no footer: the one link it used to carry, to the source on GitHub, is in the header."
        variables:
          - id: lang
            description: the page's language code
          - id: t
            description: the language's strings
          - id: title
            description: the page's own title, empty on the home page
          - id: preview
            description: "what a link to the page shows: its description — the strings' meta description, an installation page's or a post's first paragraph — its picture — a post's first picture, else the home page's first screenshot in the page's language — and its type, article for a post, website otherwise"
          - id: section
            description: which menu item is current — home, install, news, or none
          - id: path
            description: "the page's own address, for the language switch and og:url — built by index.php from the page it routed to and the post's slug, and / for a page not found, never taken from the request: a request for /%5Cevil.com made the switch a link to /\\evil.com, which browsers take for another site (found in review, 2026-10-27)"
          - id: body
            description: the page's rendered body, HTML
          - id: link
            description: "@LandingPage#site#url bound to the page's explicit language, for every link to the site's own pages"
          - id: header_links
            description: the language's header links from @LandingPage#links
      - id: backdrop
        type: "@View"
        src: templates/backdrop.php
        description: "Behind every page, fixed to the window, the whole layer 70% transparent (the author, 2026-10-22) — 80% on a window narrower than 1100 pixels and 86% narrower than 760, where the text takes the whole width and lies on the background, which hurt its reading. After the logo, whose gears stand on stems meeting in one point like a bouquet of hogweed — what the author likes most in it: a meadow of bouquets of gears along the whole bottom edge, each group one or two hogweed plants — four or five gears are two plants with roots apart — carrying several gears as a hogweed carries several umbels, and grown as one grows: a main stem rising from below the edge nearly straight, slightly bent, to its highest gear, and straight rays leaving it at heights of their own for its other gears: only the stem may bend, the rays to the umbels are straight lines (the author, 2026-10-22). Tried and turned down (the author, 2026-10-22): every gear on a ray from one node (too alike, a starburst); long stems fanning from one point out of sight below the edge; a stem of its own from the ground for every gear (a hogweed carries several umbels, not one); one root forking again and again towards the middle of the gears left (every plant looked towards one point, a bouquet or a bush). The stems' randomness is a hash of where they are, so changing them leaves the rest of the layout as it is. Each group of plants is different: its height, lean, the spread of its rays, three to five gears of their own sizes; near and large at the window's sides, and in the middle a mix of every depth, small among large, with one plant tall enough that its highest gears stand beside the logo, and the one right of the middle carrying two gears more than it grew with — added in its crown beside the others and as large as they are, on rays of their own leaving the stem high up (small ones hanging low looked odd), so its shape stayed as it was: made larger, or grown again at another depth, it looked worse (the author, 2026-10-22) — a meadow large at the sides and small in the middle was a pattern the author did not want (2026-10-22); eight groups in all. Above the meadow, small gears drift in the air like seeds, all over the window, most of them far and hazy, rising and sinking a little as they turn — the atmosphere the author asked for. Laid out by a generator with a fixed seed, so the page looks the same at every visit. The gears are shaped like the logo's — 8 to 14 broad, near-square teeth as wide as the gaps between them, a wide hole; a big gear of 24 fine teeth looked like a saw blade — and all of them somewhat out of focus, the far ones most, since sharp gears behind the page looked worse; blurred twice as much looked worse again. The gears turn slowly, each at its own pace. One or two umbels of each near or middle plant are in one of the logo's colours, as the logo's gears are — its outline in the colour and a faint fill of it — drawn in a layer of their own, blended normally, since blended as the other outlines are the dark background swallowed the colour. The plants stand still: swaying in a wind made the page seem to rock, and gears leaving the umbels to drift off like seeds, though nice to watch, made hogweed a dandelion, which it is not (both tried and turned down by the author, 2026-10-22). Beneath the gears three large soft patches of the logo's colours drift slowly, whose colour the thin light outlines take up where they cross them; on the dark gradient below they are a little more transparent than they began (0.45, after 0.55); much dimmer ones, on the lighter gradient the page first had, looked worse. No grain: a fine one over the background was tried and looked worse (the author, 2026-10-22). The page's own gradient under it all is nearly black, a little blue — #070712 at the top to #010104 at the bottom — so that only the patches glow, which together read as deep water; found step by step, the steps lighter and the one darker all looking worse (the author, 2026-10-22). A dusk sky instead — nearly black above, lighter towards the ground, with a fine grain, with and without a horizon glowing in the logo's colours — was tried and looked worse than the patches (the author, 2026-10-22). Tried before and turned down by the author: many small gears in a different colour each, joined by lines with points of light running along them, which looked cheap — a constellation of lines is a cliché, gears each their own colour read as confetti; the same gears scattered over the window, and with a fade towards the middle; single gears at three depths with a meshing pair. Each gear and patch is a layer of its own that the browser turns or moves without redrawing the page; no script. The layer catches no clicks and is hidden from screen readers; with reduced motion asked for, nothing moves."
      - id: header
        type: "@View"
        description: "A bar across the top, part of templates/layout.php: the logo and 'Borshevik' linking home — the logo, here and on the home page, glowing softly while the pointer is over it, in a slowly turning gradient of its own colours, close around it (still, when the visitor's system asks for reduced motion) — without a glow the page was a little worse, and the first one, brighter, wider and turning faster, too showy (the author, 2026-10-22); the menu — Home, News, and Install last, drawn as the download buttons are — a gradient outline, filled by the gradient under the pointer, and filled while an installation page is shown (always filled, it was too loud; the author, 2026-10-22) — since getting Borshevik is what most visitors came for and the home page itself no longer carries download buttons — with the current section marked (Install is current on both installation pages); the header links of the page's language (@LandingPage#links), each an icon with the network's name as its label for screen readers; and a language switch naming the other language, which links to the same path with `?lang=` set to it. On a narrow screen the menu wraps under the logo rather than hiding behind a button, since three items always fit."
      - id: home
        type: "@Template"
        src: templates/home.php
        engine: PHP
        output_format: HTML
        description: "The home page's body. On top, the page's title piece, set apart from the grid the sections below follow: the logo, the name and the slogan from the strings ('Deep roots, fresh growth' — the immutable Fedora base and the updates that grow on it, in the plant the name comes from) centred, the slogan right under the name as a quiet italic caption rather than a second heading, in the lilac of the logo's gears, darkened to stay quieter than the name, rather than grey (the author, 2026-10-23) — a muted pink at first, which stood apart from the name, and the gears' own lilac was too light; spaced capitals like the name's were tried and dropped for the italic (the author, 2026-10-27), and under them a row wider than the sections' — yet never wider than the window — with a large screenshot (media/<lang>/hero.webp, its alt text from the strings) on the left, taking 72% of it, and on the right, from its top and as far from the screenshot as the sections' text is from theirs, the tagline under a short heading of its own, as the sections below have — without one the tagline read lifeless (the author, 2026-10-22) — both from the strings: the tagline — a few short paragraphs, separated in the string by a blank line — in larger type than the sections' text; on a narrow screen the tagline goes under the screenshot. So the first screen alone says what Borshevik is and shows it; the way to get it is the Install button in the header, not buttons here. Below, the home page's Markdown from @LandingPage#content, split by @LandingPage#markdown#markdown_sections: each group title is a heading across the page, and each section a row with its screenshot on the left and its text on the right — the screenshot stacked above the text on a narrow screen, and the text across the whole row for a section with no screenshot. The row under the title piece and every section each sit on a card of their own, as the header does — dark, translucent, the background blurred behind it, a faint border, rounded corners — so the text never lies on the background's gears (the author, 2026-10-22); the group titles stand on the background between them. In a section's card the screenshot and the text both start at its top, the heading level with the screenshot's top edge: centred against each other, whichever was shorter floated in the middle of the other's height and looked lost (the author, 2026-10-22). A section whose text holds the `::exclusive` directive shows a badge 'Borshevik exclusive' above its heading: it marks what Borshevik has and other systems do not — its own GNOME Shell extensions — so they stand out from what any Fedora GNOME could be given."
        variables:
          - id: t
            description: the language's strings
          - id: sections
            description: the home page's Markdown as group titles and sections, each part rendered
          - id: lang
            description: the page's language, naming the folder of the first screenshot
      - id: page
        type: "@Template"
        src: templates/page.php
        engine: PHP
        output_format: HTML
        description: "The body of a text page — the two installation pages, and the not-found page — a title over rendered Markdown. On the installation pages, a row of tabs above the title switches between them: a fresh installation (/install) and switching an existing Fedora Atomic or uBlue system (/install/rebase), two paths that share nothing after the first sentence, so each reader sees only theirs."
        variables:
          - id: title
            description: the page's title
          - id: text
            description: the page's Markdown, rendered
          - id: tabs
            description: for an installation page, its tabs — label, link and whether it is the current one; empty elsewhere
      - id: downloads
        type: "@Template"
        src: templates/downloads.php
        engine: PHP
        output_format: HTML
        description: "The two download buttons, side by side where there is room: 'Download' with the standard ISO's size and the subtitle 'Standard image · AMD / Intel graphics', and 'Download (NVIDIA)' with its size and 'NVIDIA image · proprietary drivers included' (the words come from the strings). Each links straight to /iso/<file name> — the file itself rather than the permanent link, so a download never goes through a redirect — with 'Checksum:' and its checksum below. A size or checksum that cannot be read is simply left out, so the button reads just 'Download'. Placed on the fresh-installation page by the `::downloads` directive."
        variables:
          - id: t
            description: the language's strings
          - id: isos
            description: for standard and nvidia, the file name, size and checksum
      - id: media-writer
        type: "@Template"
        src: templates/media-writer.php
        engine: PHP
        output_format: HTML
        description: "Two buttons of the same size and look as the download buttons — the gradient outline that fills on hover — so every button on the page that gets the reader something looks alike, for getting Fedora Media Writer: its GitHub releases (macOS / Windows) and its Flathub page (Linux). Placed by the `::media-writer` directive in the step about writing the USB drive, where the reader needs it — not under the download buttons, where it came before the step it belongs to."
        variables:
          - id: t
            description: the language's strings
      - id: news-list
        type: "@Template"
        src: templates/news.php
        engine: PHP
        output_format: HTML
        description: "The news page: every post of the language, newest first, each on a card of its own (@LandingPage#style) that opens the post wherever it is clicked — the title is the one link, stretched over the whole card, so a screen reader still hears one link per post — and that lights up under the pointer. On the left, a thumbnail of the post's first picture, large enough to stand as tall as the text beside it; on the right, its date, its title and its excerpt; a post with no picture has its text across the card. A line saying there is no news yet when there are none. On a narrow screen the thumbnail stays beside the text, only smaller."
        variables:
          - id: t
            description: the language's strings
          - id: items
            description: the posts from @LandingPage#news#news_list
          - id: link
            description: as in @LandingPage#layout#frame, for the links to the posts
      - id: post
        type: "@Template"
        src: templates/post.php
        engine: PHP
        output_format: HTML
        description: "One post: a link back to the news, the date, the title and the rendered body."
        variables:
          - id: t
            description: the language's strings
          - id: entry
            description: the post from @LandingPage#news#news_post
          - id: text
            description: its body, rendered
          - id: link
            description: as in @LandingPage#layout#frame, for the link back to the news
  - id: strings
    type: "@ConfigFile"
    src:
      - i18n/en.php
      - i18n/ru.php
    format: PHP returning an array of string keys to plain text
    description: "The words of the interface around the pages' own text, one file per language — the menu, the download buttons, the footer, the meta description, the home page's tagline with its heading, and screenshot captions, the news page's labels, the not-found page. Plain text, escaped when printed — except the tagline, whose `**bold**`, `*italic*` and `[text](url)` are rendered as in @LandingPage#markdown#markdown_inline, for the proper names that stand out in it as the guidelines have them do. Both files carry the same keys: a key missing from one would leave that text blank in that language with no error anywhere, which is why @LandingPage#check compares them."
  - id: links
    type: "@ConfigFile"
    src: links.php
    format: PHP returning, per language code, a list of ['id', 'label', 'url']
    description: "The header's links to Borshevik elsewhere, per language, because the communities are: the GitHub repository is shared by both, while the Telegram channel and the X account are Russian-speaking and shown only on the Russian pages — an English visitor sent there would find nothing to read. An English-speaking community, such as a Discord server, is added to the English list alone. Each entry's id names its icon in icons/. The order of a list is the order in the header."
    components:
      - id: icons
        type: "@Graphic"
        src: icons/
        format: SVG, one per link id, drawn in currentColor on a 24×24 view box
        description: The links' icons, inlined into the header rather than loaded as images, so they take the text colour and its hover state from the stylesheet and cost no extra requests.
  - id: content
    type: "@Folder"
    src: content/
    description: "The text of the site's own pages, in the Markdown of @LandingPage#markdown, one folder per language holding the same files. home.md is what Borshevik comes with, below the home page's first screen, written as @LandingPage#markdown#markdown_sections reads it: sections each with one screenshot or video, grouped under titles. The first group is the system — being ready to work (the App Manager's app selection, Chrome, codecs) and moving from another computer first, what a newcomer cares about, then the image and its updates (the author, 2026-10-30), Android, games — Steam preinstalled, and any other launcher through PortProton, which the App Manager's Games category installs — the VPN. The GNOME group gives Borshevik's own extensions the most room and the `::exclusive` badge — the Workspace Manager in three sections, how windows take their places, the workspaces turned into tabs on the panel — dragged to reorder them, switched by Super+number, and the + tab at the end opening a new workspace in the overview, or dragged between two for one there; workspaces coming and going by themselves, an emptied one taking the user to the one on its left, and window rules; the screen translator and the layout-independent app search briefly — and ends with the extensions it ships preinstalled, as a list. install.md and rebase.md open with a `# ` title. The fresh-installation page takes a newcomer from the download to a working desktop: downloading the ISO (the `::downloads` directive); writing it to a USB drive (`::media-writer`); booting from it, recommending Secure Boot on, since then only signed software starts before the system (the author, 2026-10-31), with a picture of the USB drive's boot menu and its default entry, which checks the drive and then starts the installer, to be left as it is (the author, 2026-10-31); the installer, which asks for the disk — and erases it entirely — recommends turning on disk encryption there, since a laptop is the machine most likely to be lost or stolen and encryption can only be chosen at installation, and asks for nothing else — the user, its password and the time zone are asked for by GNOME Initial Setup at the first start, after the passphrase, the first user being the computer's administrator — all of it in one video from the installer to the desktop; on the NVIDIA image with Secure Boot on, the key enrollment of the first start, right after the passphrase and before Initial Setup: the boot screen's message and its countdown, then on the blue MOK manager screen Enroll MOK, Continue, Yes, the password borshevik and Reboot; and the App Manager at the first login, with GNOME's welcome tour, which can be skipped. A fresh installation no longer restarts by itself at its first start, its kernel arguments being set by the installer (borshevik's 23899bb). The rebase page switches an existing Fedora Atomic or uBlue system in two rebases: first to the unsigned image (`ostree-unverified-registry:`), then, after restarting into it, to the signed one (`ostree-image-signed:docker://`). One rebase straight to the signed image fails, because the system being switched has neither Borshevik's container signature policy nor the registry configuration that says where its signatures are (borshevik's container-policy) — both arrive with the Borshevik image, so only once it runs can the signed rebase verify anything; from then on every update is checked. A third step tells how to go back if Borshevik is not for them (the author, 2026-10-31): by rebasing again — to Fedora as its ISO installs it, the ostree remote `fedora` at ostree.fedoraproject.org with Fedora's mirrorlist as its contenturl (a 404 without it) and the GPG key Borshevik's /etc/pki/rpm-gpg holds, added first, since Borshevik has no ostree remotes, then `fedora:fedora/<version>/x86_64/silverblue`, every update's signature checked, the version written out and to be bumped with each Fedora release; not quay.io/fedora's images, which Fedora does not sign and which leave the system on an unverified container origin (the author, 2026-10-31); or to a uBlue image signed, Borshevik's container policy holding uBlue's keys — all of it tried end to end in a machine on 2026-10-31, from a fresh Silverblue 44 through Borshevik, Bluefin and Borshevik again back to Fedora — since after the second rebase the system they came from is no longer among the deployments, rpm-ostree keeping only the booted one and the new one. What the pages say about Borshevik is taken from the borshevik repository's README and spec, so a change there is a change to make here too."
    components:
      - id: media
        type: "@Folder"
        src: media/
        description: "The pages' screenshots and short videos — media/, not images/, since it holds both (the author, 2026-10-24) — one folder per language — media/en/ and media/ru/, holding the same file names — because what they show is Borshevik's own interface, which speaks the visitor's language: a Russian page shows the system in Russian. Each language's Markdown names its own folder (`en/<name>.webp`), and the home page's first screenshot is media/<lang>/hero.webp. Screenshots are WebP at most 1600 pixels wide, so the pages stay light even on a phone. Videos are H.264 MP4, silent, looping seamlessly (their last frame is their first), at most 1600 pixels wide and kept under 5 MB each, small enough to live in the repository with the site. All of them are taken in a virtual machine with @LandingPage#recipes#take_screenshots, except the few it cannot stage, which the author takes on a real machine."
  - id: posts
    type: "@Folder"
    src: posts/
    description: "The news, one folder per post named `YYYY-MM-DD-<slug>` — the date it is published, or, for news of what shipped before it was announced, the day it shipped, so the news list keeps the order things happened in (the author, 2026-10-27), and a slug of lowercase letters, digits and hyphens — which is also the post's address, /news/YYYY-MM-DD-<slug>. A post is one announcement: the same text goes on the site and, later, to the Telegram channel and X, so it is written to be read on its own. The folder holds ru.md and en.md — every post exists in both, the English one translated from the Russian when the announcement is prepared, never on the fly — each opening with a `# ` title line, the first paragraph serving as the excerpt in the news list; every post has a picture, not a video, and its first is the post's thumbnail in the news list and its link preview's image, so it shows the news itself — the translator open over the text it translated, not its settings — cropped to what matters where the screen holds more (the author, 2026-10-27); and the post's pictures and videos, named from the Markdown by bare file name — `<name>.<lang>.webp` for one that shows Borshevik's interface, which speaks the post's language. Videos are held to what the pages' are, under 5 MB, and live here too, in git. A post shows Borshevik as it was when the post came out, so its pictures are its own, never the pages' in media/, which are taken again as Borshevik changes; each is made by a script of its own in tools/capture/posts/ — in the test machine (@LandingPage#capture#pictures), or, for a picture of the site itself, by Chrome without a window from the site served on this machine (@LandingPage#recipes#run), which its comments describe, not this spec — posts come often, and the spec holds the rules they follow, not each one (the author, 2026-10-24). Announcing a post in the Telegram channel and on X is not built yet; what the author settled is that it is done straight from this machine, not through GitHub, and on X without X's API, which since 2026 charges for every post — the Telegram text is the post's full Markdown, and for X it is cut into a thread by whoever prepares the announcement, not by a script. A post is published by committing its folder and pushing, like any change; one that should not be seen yet stays out of the repository. The folder is served as it is, so a post's pictures load straight from it."
  - id: style
    type: "@File"
    src: style.css
    format: CSS
    description: "The site's only stylesheet: dark only, in the look the site has always had — the night-blue radial background, and the mint-to-lilac-to-pink gradient on the download buttons and the header's Install button — carried over to a header, a content column of comfortable reading width, the home page's wider rows of screenshot and text, and the news list. What is read sits on cards — dark, translucent, the background blurred behind them, a faint border, rounded corners, like the header: each block of the home page, each news item, a post whole, and the installation page whole, tabs included (the author, 2026-10-22). The download and Fedora Media Writer buttons have a ground of their own inside their gradient outline, the code blocks' own surface colour, since transparent the gears behind showed through their labels; a darker, translucent one looked worse (the author, 2026-10-22). A card reaches out past the text it holds by its own padding, so the text keeps the width it had without one — put on cards within the old widths, everything had shrunk. Screenshots have rounded corners, a soft shadow and a 1-pixel outline in the site's gradient at full strength: without an outline they looked worse, and toned down — at under half or three quarters — it looked odd (the author, 2026-10-22). Readable down to phone width with no horizontal scrolling."
  - id: logo-file
    type: "@Graphic"
    src: borshevik_logo.svg
    format: SVG
    role: logo
    description: The Borshevik logo, shown on the page and used as its favicon.
  - id: applications
    type: "@ConfigFile"
    src: share/applications.json
    format: JSON
    description: "Not part of the page: the curated application list the App Manager of every Borshevik image downloads from https://borshevik.org/share/applications.json on first login, kept here because this site is where it is served from. A typed successor, applications-v2.json, carried Android apps as APK links for the App Manager of the experimental images of 2026-10-01 to 2026-10-03; it was dropped once Android apps came from Google Play instead, leaving this the one list. Changing it changes what every new Borshevik install offers, from the next deploy on, with no image rebuild. A JSON array of categories, shown in the App Manager in this order. Each category: `name` — the English name, and the fallback for any language the entry lacks; an optional key per language code (`ru`, `en`) with the name in that language; `default` — true when the category is preselected; `applications` — Flathub application ids, installed in this order. The App Manager drops a category whose localized name or `applications` is empty, and shows an error page when the file is not an array or has no usable category, so a malformed edit here breaks first-login app installation on every machine."
  - id: iso-directory
    type: "@Folder"
    path: <site root on the server>/iso
    description: "Every installer image the site has offered or is about to, next to index.php on the server and nowhere else — not in the repository, and never written by @BorshevikLandingWorkflow#deploy, which only adds and replaces the site's own files. borshevik's publish-iso workflow uploads each build here as `borshevik-<YYYYMMDD>-<run number>.iso` and `borshevik-nvidia-<YYYYMMDD>-<run number>.iso`, each with its `-CHECKSUM`, verified on the server; a name is never reused, so a file is never replaced while someone downloads it. A build is uploaded before it has been tried — the author tries it by downloading it from here, exactly as users will — so this folder can hold a build nobody has confirmed yet; nothing links to it until @LandingPage#offered-isos names it, and one that fails its trial is deleted by hand. Nothing is ever deleted automatically: images the site no longer offers stay until removed by hand, and must not be removed while @LandingPage#offered-isos still names them. The files named in the list below predate unique names: the four `*-stable.iso*` files were the only copies until 2026-09, and `borshevik-20260226.iso` and `borshevik-nvidia-20260226.iso` are hard links to the same data under unique names, made so the permanent links could start redirecting without a new build — their -CHECKSUM files are copies with the new name inside. The `*-stable.iso*` names are never served any more, since @LandingPage#htaccess rewrites those URLs, and can be deleted once nothing needs them."
    files:
      - id: borshevik-stable.iso
        path: <site root on the server>/iso/borshevik-stable.iso
        format: ISO 9660
      - id: borshevik-stable.iso-CHECKSUM
        path: <site root on the server>/iso/borshevik-stable.iso-CHECKSUM
        format: sha256sum output — `<hash>  <iso name>`
      - id: borshevik-nvidia-stable.iso
        path: <site root on the server>/iso/borshevik-nvidia-stable.iso
        format: ISO 9660
      - id: borshevik-nvidia-stable.iso-CHECKSUM
        path: <site root on the server>/iso/borshevik-nvidia-stable.iso-CHECKSUM
        format: sha256sum output — `<hash>  <iso name>`
      - id: borshevik-20260226.iso
        path: <site root on the server>/iso/borshevik-20260226.iso
        format: ISO 9660
      - id: borshevik-20260226.iso-CHECKSUM
        path: <site root on the server>/iso/borshevik-20260226.iso-CHECKSUM
        format: sha256sum output — `<hash>  <iso name>`
      - id: borshevik-nvidia-20260226.iso
        path: <site root on the server>/iso/borshevik-nvidia-20260226.iso
        format: ISO 9660
      - id: borshevik-nvidia-20260226.iso-CHECKSUM
        path: <site root on the server>/iso/borshevik-nvidia-20260226.iso-CHECKSUM
        format: sha256sum output — `<hash>  <iso name>`
guidelines:
  - "In every text the site shows — the pages of @LandingPage#content, the posts of @LandingPage#posts, the home page's tagline in @LandingPage#strings — proper names of products, projects, companies and technologies (Borshevik, the App Manager, GNOME, Chrome, Steam, Google Play, Hiddify) are in bold at every mention, and not links: links to them made the text hard to read (the author, 2026-10-30). Headings and the captions of pictures and videos carry no marks. Bold otherwise marks what is pressed or read on the screen — buttons, windows, keys — and what must not be missed."
  - A picture's or video's caption is a few words naming what it shows — 'How workspaces work' — not a step-by-step account of the video, which read as too long under it (the author, 2026-10-30).
recipes:
  - id: run
    description: Serves the site from the working tree on this machine, so a change can be seen before it is committed
    instructions:
      - "PHP is not installed on the host, and is not needed: from the repository root, run on the host (through `flatpak-spawn --host` when the shell is sandboxed) `podman run -d --rm --name borshevik-landing-preview -p 8000:8000 -v \"$PWD\":/srv:Z,ro -w /srv registry.fedoraproject.org/fedora-minimal:44 sh -c 'microdnf -y -q install php-cli jq >/dev/null 2>&1 && exec php -S 0.0.0.0:8000 index.php'`. index.php is given as the router script because php -S ignores .htaccess, and without it /install, /news and the posts would not exist here (@LandingPage#index#run). The image comes from Fedora's registry because this machine's container signature policy rejects docker.io images, the official php one included. jq is installed only so @LandingPage#tests#checks can run in the same container with `podman exec borshevik-landing-preview bash tests/check.sh`. Installing takes up to a minute; the server is up once `podman logs borshevik-landing-preview` prints 'Development Server ... started'"
      - Tell the author to open http://127.0.0.1:8000, /install, /news and the post the change touches, each also with ?lang=ru — not `localhost`, which can resolve to IPv6 and miss the published port. The working tree has no `iso/` folder, so the download buttons show no size and no checksum; that is expected here and not a defect. php -S answers a request for part of a file with the whole of it, so the installer's video cannot be scrubbed here, which the production server, answering such requests, allows; nor does php -S apply .htaccess, so the permanent ISO links cannot be tried here
      - Ask the author whether the change looks right; when they answer, stop it with `podman stop -t 2 borshevik-landing-preview` (php -S ignores SIGTERM, so a longer grace period only waits for the kill)
  - id: take_screenshots
    description: Makes the pages' screenshots and videos again in a virtual machine, in both languages — all of them, or the ones named — so they show Borshevik as it is now and nothing of anyone's own desktop
    arguments:
      - id: pictures
        description: picture scripts of @LandingPage#capture#pictures to run, by name; all of them when not given
    instructions:
      - "On the host (through `flatpak-spawn --host` when the shell is sandboxed), start a test machine from the borshevik repository with `tests/test-image-in-vm.sh run --keep --scenarios none` — the current `:latest`, logged in as tester, with nothing personal in it — in the background, since it takes several minutes; continue once it prints how to reach the machine. A machine already running from an earlier session will do; one that was stopped is booted again from its run directory's disk with the qemu command the script uses, and then needs @LandingPage#capture#prepare again before anything is filmed: prepare stops automatic updates only until the next boot, and an update downloaded meanwhile puts its icon in the panel mid-take (2026-10-23)"
      - For each language, English first, run @LandingPage#capture#take with <pictures> — or `all` — and the language. It logs tester in again in that language and runs each script; filming takes a few minutes, so run it in the background
      - "Look at every picture it made before showing any: the screenshots, and for a video a sheet of its frames. A picture that came out wrong — a dialog nobody expected, a window not where the scene needed it, an animation cut short — is fixed in its script or scene and made again, never touched up by hand, so the next run makes it right too. A new picture for a page is a new script with its `# makes:` line, written by staging it step by step with @LandingPage#capture's commands and looking at @LandingPage#capture#shot after each"
      - When the installer's pictures are among those asked for, or the installer has changed, download the newest published standard ISO as borshevik's tests/try-iso.sh does, into its cache, and run @LandingPage#capture#installer's take with it once per language, in the background; it needs no test machine and can run beside one. When the MOK video is among them, or borshevik's MOK enrollment has changed, do the same with the newest NVIDIA ISO and installer.sh's mok
      - Ask the author for the pictures @LandingPage#capture#by-hand lists, if a page has gained one or one has gone stale
      - "Show the author the pages with the new pictures through @LandingPage#recipes#run and redo what they ask for. Then stop the machine: power it off through its QMP socket and delete the run directory's disk"
