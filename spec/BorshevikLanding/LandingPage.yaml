name: Borshevik landing page
description: "The whole of borshevik.org: one PHP script that renders one of two HTML templates, a stylesheet and the logo; the choice of which installer images the site offers (@LandingPage#offered-isos), with the redirect that keeps the permanent ISO links pointing at that choice; and one file that is no part of the page but is served from this site, the App Manager's application list (@LandingPage#applications). There is no framework, no build step and no database — the files in the repository are the files the web server runs, copied there by @BorshevikLandingWorkflow#deploy. The images themselves are not in the repository: they sit in the server's `iso/` folder (@LandingPage#iso-directory), uploaded there by borshevik's publish-iso workflow, each under a name no other build shares. Uploading one changes nothing a visitor sees; the site starts offering it when @LandingPage#offered-isos is changed and deployed. The page takes each offered ISO's size and checksum from the files on the server, so the numbers it shows are those of the file a visitor actually downloads."
extends: @Software
platform: PHP 8 behind LiteSpeed, which honours .htaccess rewrite rules (the production host is InterServer shared hosting). Uses only the standard library.
repository: https://github.com/komorebinator/borshevik-landing
src: .
tests:
  - id: checks
    description: "The failures that stay silent until a visitor or a new install hits them: index.php no longer parsing (the whole site answers 500), an applications.json the App Manager will refuse (first-login app installation breaks on every new machine), a placeholder missing from one template or misspelt in one (that value quietly vanishes from one language), an offered ISO name that is malformed or equal to a permanent link (the permanent link would redirect to itself), the permanent links no longer redirecting where they should, and the render path itself — language choice, links, ISO size and checksum. Run by @BorshevikLandingWorkflow#deploy before anything is uploaded, and before every commit."
    command: bash tests/check.sh
    expect: exits 0 and prints 'all checks pass'
  - id: seen-by-the-author
    description: Manual. Whether the page reads and looks right in both languages is nothing a script can judge, so the author serves the changed working tree and looks at it. This is the @BorshevikLandingWorkflow `implemented` step.
    command: "@LandingPage#recipes#run"
    expect: the author confirms both http://127.0.0.1:8000 and http://127.0.0.1:8000/?lang=ru look right
components:
  - id: check
    type: @ShellScript
    interpreter: bash
    src: tests/check.sh
    description: "The script behind @LandingPage#tests#checks. Needs php-cli, jq and curl, all present on the GitHub runner; on this machine it runs inside the same container @LandingPage#recipes#run uses, with jq installed alongside php-cli. Works from any current directory — it resolves the repository root from its own location — and never writes into the repository: everything it runs, it runs in a temporary copy, removed on exit."
    functions:
      - id: run
        description: Runs every check, reporting each as ok or FAIL and going on after a failure; exits 1 if any failed, else prints 'all checks pass'. The checks: the PHP files parse; applications.json has the shape @LandingPage#applications says the App Manager needs; each template carries exactly the placeholders index.php replaces; iso.php offers exactly a standard and an NVIDIA name, both of the unique form `borshevik[-nvidia]-<YYYYMMDD>[-<n>].iso` — which also keeps either from being a permanent link's own name, whose redirect would then point at itself; .htaccess holds the four permanent-link rewrites; the page renders in the expected language for an explicit ?lang=, for a preferred Accept-Language and for an unsupported one, with links to both offered ISOs, the size and checksum of an ISO that exists, no size for one that does not, and no placeholder left; and download.php redirects both variants and a checksum to the offered files and answers 404 for anything else.
  - id: index
    type: @Script
    interpreter: php
    src: index.php
    description: "Entry point for every request to `/`. Reads which ISOs are offered and their metadata, picks the language, fills the chosen template and sends it. Stateless: nothing is cached between requests, so a switch to other ISOs shows up on the next page load after the deploy."
    functions:
      - id: read_checksum
        description: The hash from an ISO's -CHECKSUM file in `iso/` (the first word of its `<hash>  <name>` line), escaped for HTML; empty when the file is missing or empty.
      - id: read_iso_size_gb
        description: An ISO's size in `iso/` as binary gigabytes with one decimal, e.g. '2.7 GB'; empty when the file is missing or unreadable.
      - id: pick_locale
        description: The page's language: the `lang` query parameter when it names a supported language, else the supported language the Accept-Language header weights highest (a regional tag counts as its base language), else English.
      - id: run
        description: Reads the offered names from iso.php and each offered ISO's size and checksum, picks the language, fills that language's template and sends it, with Vary: Accept-Language and Content-Language so caches keep the languages apart. An unreadable template falls back to English, and a template that cannot be read at all answers 500. Every value is escaped before it is substituted, the templates doing no escaping of their own. A size or checksum that cannot be read is simply left out, so the button reads just 'Download'. The template map here is the list of supported languages.
  - id: offered-isos
    type: @ConfigFile
    src: iso.php
    format: PHP returning an array
    description: "Which installer images the site offers — the one place that says so, read by @LandingPage#index and @LandingPage#download. Returns `['standard' => '<file name>', 'nvidia' => '<file name>']`, names of files in @LandingPage#iso-directory. Switching the site to newly uploaded ISOs is a change to these two names, committed and deployed like any change; @BorshevikLandingWorkflow#deploy refuses to deploy names whose ISO or -CHECKSUM is not on the server, so a switch cannot break the download buttons. Contains no logic and prints nothing, so requesting /iso.php directly shows an empty page."
  - id: download
    type: @Script
    interpreter: php
    src: download.php
    description: "Where the permanent ISO links end up (@LandingPage#htaccess rewrites them here): redirects to the file currently offered."
    functions:
      - id: run
        description: "Loads the offered names from iso.php. Reads `variant` from the query; when it is not a string naming a key of that array, answers 404 with text/plain 'Not found' and exits. Otherwise takes that variant's file name, appends '-CHECKSUM' when the `file` query parameter is exactly 'checksum', and answers 302 with `Location: /iso/<rawurlencoded name>` and `Cache-Control: no-store`, so neither browsers nor proxies keep sending people to an ISO the site no longer offers."
  - id: htaccess
    type: @ConfigFile
    src: .htaccess
    format: Apache/LiteSpeed rewrite rules
    description: "Keeps the ISO links that have been published for years — https://borshevik.org/iso/borshevik-stable.iso, the NVIDIA one, and their -CHECKSUM files, all used by the borshevik README and anywhere else people copied them — pointing at whatever the site offers now, instead of at a file that may be long gone. `RewriteEngine On` and four internal rewrites, each ending in [L]: `^iso/borshevik-stable\\.iso$` → `download.php?variant=standard`, `^iso/borshevik-stable\\.iso-CHECKSUM$` → `download.php?variant=standard&file=checksum`, `^iso/borshevik-nvidia-stable\\.iso$` → `download.php?variant=nvidia`, `^iso/borshevik-nvidia-stable\\.iso-CHECKSUM$` → `download.php?variant=nvidia&file=checksum`. The rules match the URL whether or not a file of that name exists, so old files still lying under those names on the server are never served again."
  - id: page
    type: @View
    description: "The page both templates render — templates/en.html and templates/ru.html carry the same markup and differ only in text, `alt` and `aria-label` wording. Each is a complete HTML document with `lang=\"{{LANG}}\"`, title 'Borshevik Linux', a meta description, borshevik_logo.svg as the favicon and style.css as the stylesheet. Adding a language means adding a template with the same markup and placeholders and registering it in the template map of @LandingPage#index#run."
    components:
      - id: en
        type: @Template
        src: templates/en.html
        engine: "plain `{{NAME}}` placeholders replaced by PHP's strtr in @LandingPage#index#run — no conditionals, loops or escaping of its own; every value is escaped before it is substituted"
        output_format: HTML
        description: English text of the page.
        variables:
          - id: LANG
            description: the chosen language code, set as the html element's lang
          - id: YEAR
            description: the current year, in the footer
          - id: ISO_STANDARD_FILE
            description: file name of the offered standard ISO, in the download button's href
          - id: ISO_NVIDIA_FILE
            description: file name of the offered NVIDIA ISO, in its button's href
          - id: SIZE_STANDARD_PART
            description: "' · 2.7 GB'-style suffix of the standard download button, or empty when the ISO is missing"
          - id: SIZE_NVIDIA_PART
            description: the same suffix for the NVIDIA download button
          - id: CHECKSUM_STANDARD
            description: the standard ISO's checksum, or empty
          - id: CHECKSUM_NVIDIA
            description: the NVIDIA ISO's checksum, or empty
      - id: ru
        type: @Template
        src: templates/ru.html
        engine: the same as @LandingPage#page#en
        output_format: HTML
        description: Russian text of the page. Carries exactly the placeholders of @LandingPage#page#en; one missing here simply leaves that value off the Russian page, with no error anywhere.
      - id: logo
        type: @Image
        description: The logo in a round frame at the top of the card, from borshevik_logo.svg.
      - id: title
        type: @Label
        label: Borshevik
        description: The page's heading, followed by a paragraph saying what Borshevik is and what it comes with.
      - id: download-standard
        type: @Button
        label: "Download{{SIZE_STANDARD_PART}} — subtitle 'Standard image · AMD / Intel graphics'"
        description: A link styled as a button straight to /iso/{{ISO_STANDARD_FILE}}, the file itself rather than the permanent link, so a download never goes through a redirect. Below it, 'Checksum:' and {{CHECKSUM_STANDARD}} in a code element.
      - id: download-nvidia
        type: @Button
        label: "Download (NVIDIA){{SIZE_NVIDIA_PART}} — subtitle 'NVIDIA image · proprietary drivers included'"
        description: A link styled as a button straight to /iso/{{ISO_NVIDIA_FILE}}. Below it, 'Checksum:' and {{CHECKSUM_NVIDIA}} in a code element.
      - id: media-writer
        type: @Label
        description: A note that Fedora Media Writer may be needed to write the image to a USB drive, with links to its GitHub releases (macOS / Windows) and to its Flathub page (Linux).
      - id: footer
        type: @Label
        description: '© {{YEAR}} Borshevik project, and a link to the borshevik repository on GitHub.'
  - id: style
    type: @File
    src: style.css
    format: CSS
    description: The page's only stylesheet: dark only, a single centred card, readable down to phone width.
  - id: logo-file
    type: @Graphic
    src: borshevik_logo.svg
    format: SVG
    role: logo
    description: The Borshevik logo, shown on the page and used as its favicon.
  - id: applications
    type: @ConfigFile
    src: share/applications.json
    format: JSON
    description: "Not part of the page: the curated application list Borshevik's App Manager downloads from https://borshevik.org/share/applications.json on first login, kept here because this site is where it is served from. Changing it changes what every new Borshevik install offers, from the next deploy on, with no image rebuild. A JSON array of categories, shown in the App Manager in this order. Each category: `name` — the English name, and the fallback for any language the entry lacks; an optional key per language code (`ru`, `en`) with the name in that language; `default` — true when the category is preselected; `applications` — Flathub application ids, installed in this order. The App Manager drops a category whose localized name or `applications` is empty, and shows an error page when the file is not an array or has no usable category, so a malformed edit here breaks first-login app installation on every machine."
  - id: iso-directory
    type: @Folder
    path: <site root on the server>/iso
    description: "Every installer image the site has offered or is about to, next to index.php on the server and nowhere else — not in the repository, and never written by @BorshevikLandingWorkflow#deploy, which only adds and replaces the site's own files. borshevik's publish-iso workflow uploads each build here as `borshevik-<YYYYMMDD>-<run number>.iso` and `borshevik-nvidia-<YYYYMMDD>-<run number>.iso`, each with its `-CHECKSUM`, verified on the server; a name is never reused, so a file is never replaced while someone downloads it. A build is uploaded before it has been tried — the author tries it by downloading it from here, exactly as users will — so this folder can hold a build nobody has confirmed yet; nothing links to it until @LandingPage#offered-isos names it, and one that fails its trial is deleted by hand. Nothing is ever deleted automatically: images the site no longer offers stay until removed by hand, and must not be removed while @LandingPage#offered-isos still names them. The files named in the list below predate unique names: the four `*-stable.iso*` files were the only copies until 2026-09, and `borshevik-20260226.iso` and `borshevik-nvidia-20260226.iso` are hard links to the same data under unique names, made so the permanent links could start redirecting without a new build — their -CHECKSUM files are copies with the new name inside. The `*-stable.iso*` names are never served any more, since @LandingPage#htaccess rewrites those URLs, and can be deleted once nothing needs them."
    files:
      - id: borshevik-stable.iso
        path: <site root on the server>/iso/borshevik-stable.iso
        format: ISO 9660
      - id: borshevik-stable.iso-CHECKSUM
        path: <site root on the server>/iso/borshevik-stable.iso-CHECKSUM
        format: sha256sum output — `<hash>  <iso name>`
      - id: borshevik-nvidia-stable.iso
        path: <site root on the server>/iso/borshevik-nvidia-stable.iso
        format: ISO 9660
      - id: borshevik-nvidia-stable.iso-CHECKSUM
        path: <site root on the server>/iso/borshevik-nvidia-stable.iso-CHECKSUM
        format: sha256sum output — `<hash>  <iso name>`
      - id: borshevik-20260226.iso
        path: <site root on the server>/iso/borshevik-20260226.iso
        format: ISO 9660
      - id: borshevik-20260226.iso-CHECKSUM
        path: <site root on the server>/iso/borshevik-20260226.iso-CHECKSUM
        format: sha256sum output — `<hash>  <iso name>`
      - id: borshevik-nvidia-20260226.iso
        path: <site root on the server>/iso/borshevik-nvidia-20260226.iso
        format: ISO 9660
      - id: borshevik-nvidia-20260226.iso-CHECKSUM
        path: <site root on the server>/iso/borshevik-nvidia-20260226.iso-CHECKSUM
        format: sha256sum output — `<hash>  <iso name>`
recipes:
  - id: run
    description: Serves the site from the working tree on this machine, so a change can be seen before it is committed
    instructions:
      - "PHP is not installed on the host, and is not needed: from the repository root, run on the host (through `flatpak-spawn --host` when the shell is sandboxed) `podman run -d --rm --name borshevik-landing-preview -p 8000:8000 -v \"$PWD\":/srv:Z,ro -w /srv registry.fedoraproject.org/fedora-minimal:44 sh -c 'microdnf -y -q install php-cli jq >/dev/null 2>&1 && exec php -S 0.0.0.0:8000'`. The image comes from Fedora's registry because this machine's container signature policy rejects docker.io images, the official php one included. jq is installed only so @LandingPage#tests#checks can run in the same container with `podman exec borshevik-landing-preview bash tests/check.sh`. Installing takes up to a minute; the server is up once `podman logs borshevik-landing-preview` prints 'Development Server ... started'"
      - "Tell the author to open http://127.0.0.1:8000 and http://127.0.0.1:8000/?lang=ru — not `localhost`, which can resolve to IPv6 and miss the published port. The working tree has no `iso/` folder, so both download buttons show no size and no checksum; that is expected here and not a defect. php -S ignores .htaccess, so the permanent links cannot be tried here either"
      - Ask the author whether the change looks right; when they answer, stop it with `podman stop -t 2 borshevik-landing-preview` (php -S ignores SIGTERM, so a longer grace period only waits for the kill)
